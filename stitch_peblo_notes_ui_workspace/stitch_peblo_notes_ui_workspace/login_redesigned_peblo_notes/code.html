<body class="font-body-md text-body-md antialiased min-h-screen flex items-center justify-center relative overflow-hidden">

</div>
<div class="mb-8 text-center">
<h1 class="text-3xl font-bold text-white tracking-tight mb-2">Welcome back</h1>
<p class="text-[#8b8b9e] font-body-md">Sign in to your AI-powered workspace</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-sm text-[#8b8b9e] block" for="email">Email address</label>
<input class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 font-body-md text-white focus:border-[#8b5cf6] focus:ring-2 focus:ring-[#8b5cf6]/30 transition-all duration-200 outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-sm text-[#8b8b9e] block" for="password">Password</label>
<a class="font-label-sm text-sm text-[#8b5cf6] hover:text-[#a78bfa] transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 font-body-md text-white focus:border-[#8b5cf6] focus:ring-2 focus:ring-[#8b5cf6]/30 transition-all duration-200 outline-none pr-12" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#8b8b9e] hover:text-white transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-gradient-to-r from-[#8b5cf6] to-[#ec4899] text-white font-label-md font-semibold text-base py-3 px-6 rounded-xl hover:-translate-y-[1px] hover:shadow-lg hover:shadow-[#8b5cf6]/25 active:translate-y-0 transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
